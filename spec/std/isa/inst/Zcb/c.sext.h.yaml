# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: c.sext.h
long_name: Sign-extend halfword, 16-bit encoding
description: |
  Takes a single source/destination operand.
  This instruction sign-extends the least-significant halfword of the source to XLEN by copying
  the most-significant bit in the halfword (i.e., bit 15) to all of the more-significant bits.
xs-attributes:
  - microarchitecture:
    - FuType: alu.sexth
    - latency: 1
    - throughput: 1.454545
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, "0~N", 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: creg
    width: 5

definedBy:
  extension:
    allOf:
      - name: Zcb
      - name: Zbb
assembly: xd
encoding:
  match: 100111---1101101
  variables:
    - name: xd
      location: 9-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |2

  if (implemented?(ExtensionName::C) && MISA_CSR_IMPLEMENTED && (CSR[misa].C == 1'b0)) {
    reserved_instruction($encoding);
  }

  X[creg2reg(xd)] = $signed(X[creg2reg(xd)][15:0]);
