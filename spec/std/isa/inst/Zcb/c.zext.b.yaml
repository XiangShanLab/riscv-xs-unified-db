# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: c.zext.b
long_name: Zero-extend byte, 16-bit encoding
description: |
  Takes a single source/destination operand.
  This instruction zero-extends the least-significant byte of the source to XLEN by inserting
  0's into all of the bits more significant than 7.
xs-attributes:
  - microarchitecture:
    - FuType: alu.sexth
    - latency: 1
    - throughput: 1.454545
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: creg
    width: 5

definedBy:
  extension:
    name: Zcb
assembly: xd
encoding:
  match: 100111---1100001
  variables:
    - name: xd
      location: 9-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |2

  if (implemented?(ExtensionName::C) && MISA_CSR_IMPLEMENTED && (CSR[misa].C == 1'b0)) {
    reserved_instruction($encoding);
  }

  X[creg2reg(xd)] = X[creg2reg(xd)][7:0];
