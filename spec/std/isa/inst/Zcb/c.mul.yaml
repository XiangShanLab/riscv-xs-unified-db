# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: c.mul
long_name: Multiply, 16-bit encoding
description: |
  Multiplies XLEN bits of the source operands from rsd' and xs2' and writes the lowest XLEN bits of the result to rsd'.
xs-attributes:
  - microarchitecture:
    - FuType: mul
    - latency: 3
    - throughput: 1.196262
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, MulUnit, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 2, 0, 1, "2~N"]

  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: creg
    width: 5
  - type: creg
    width: 5

definedBy:
  extension:
    allOf:
      - name: Zcb
      - name: Zmmul
assembly: xd, xs2
encoding:
  match: 100111---10---01
  variables:
    - name: xd
      location: 9-7
    - name: xs2
      location: 4-2
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |

  if (implemented?(ExtensionName::C) && MISA_CSR_IMPLEMENTED && (CSR[misa].C == 1'b0)) {
    reserved_instruction($encoding);
  }

  X[creg2reg(xd)] = X[creg2reg(xd)] * X[creg2reg(xs2)];
