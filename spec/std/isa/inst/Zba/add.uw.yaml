# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: add.uw
long_name: Add unsigned word
description: |
  Performs an XLEN-wide addition between xs2 and the
  zero-extended least-significant word of xs1.
xs-attributes:
  - microarchitecture:
    - FuType: alu.adduw
    - latency: 1.032227
    - throughput: 2.652850
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    width: 5
  - type: reg
    width: 5
  - type: reg
    width: 5

definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: Zba
assembly: xd, xs1, xs2
encoding:
  match: 0000100----------000-----0111011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
pseudoinstructions:
  - when: xs2 == 0
    to: zext.w xd, xs1
operation(): |
  X[xd] = X[xs2] + X[xs1][31:0];
