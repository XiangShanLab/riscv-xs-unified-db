# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.h.w
long_name: Floating-point Convert Word to Half-precision
definedBy:
  extension:
    oneOf:
      - name: Zfh
      - name: Zhinx
description: |
  `fcvt.h.w` converts a 32-bit signed integer to a half-precision floating-point number.
xs-attributes:
  - microarchitecture:
    - FuType: i2f
    - latency: 6.029297
    - throughput: 0.785276
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, IntToFP, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 2, 0, 1, "2~N"]

  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: freg
    reg_type: FLOAT
    width: 5
  - type: reg
    width: 5

assembly: fd, xs1, rm
encoding:
  match: 110101000000-------------1010011
  variables:
    - name: xs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
