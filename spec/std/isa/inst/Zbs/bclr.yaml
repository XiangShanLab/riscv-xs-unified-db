# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: bclr
long_name: Single-Bit clear (Register)
description: |
  Returns xs1 with a single bit cleared at the index specified in xs2.
  The index is read from the lower log2(XLEN) bits of xs2.
xs-attributes:
  - microarchitecture:
    - FuType: alu.bclr
    - latency: 1
    - throughput: 2.645995
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, "0~N", 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    width: 5
  - type: reg
    width: 5
  - type: reg
    width: 5

definedBy:
  extension:
    name: Zbs
assembly: xd, xs1, xs2
encoding:
  match: 0100100----------001-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg index = X[xs2] & (xlen() - 1);
  X[xd] = X[xs1] & ~(1 << index);
