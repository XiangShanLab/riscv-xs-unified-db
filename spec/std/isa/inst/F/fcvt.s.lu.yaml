# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fcvt.s.lu
long_name: Floating-Point Convert Unsigned Long to Single-Precision
description: |
  The `fcvt.s.lu` instruction converts a 64-bit unsigned integer into a single-precision floating-point number.
xs-attributes:
  - microarchitecture:
    - FuType: i2f
    - latency: 6.029297
    - throughput: 0.785276
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, RenameTableWrapper, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, ExuBlock, IntToFP, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 0, 1, 0, 0, 0, 0, "2~N", 0, 1, 0, 1, 2, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, NX, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: freg
    reg_type: FLOAT
  - type: reg
    reg_type: INTEGER

definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: F
assembly: fd, xs1, rm
encoding:
  match: 110100000011-------------1010011
  variables:
    - name: xs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode rounding_mode = rm_to_mode(rm, $encoding);
  F[fd] = ui64_to_f32(X[xs1], rounding_mode);
  mark_f_state_dirty();
