# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: fsqrt.s
long_name: Floating-Point Square Root Single-Precision
description: |
  The `fsqrt.s` instruction computes the square root of `fs1` and writes the result is written to `fd`.
xs-attributes:
  - microarchitecture:
    - FuType: fDivSqrt.vfsqrt
    - latency: 5.234375
    - throughput: 0.707182
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, FDivSqrt, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 1, 1, "5~N", "0~N", 1, "2~N"]
  - architecture:
    - exceptions: [NX, NV, PageFault_inst, IllegalInst, AddrMisalign_inst]

operands-constraints:
  - type: freg
    reg_type: FLOAT
  - type: freg
    reg_type: FLOAT

definedBy:
  extension:
    name: F
assembly: fd, fs1, rm
encoding:
  match: 010110000000-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
  check_f_ok($encoding);
  RoundingMode mode = rm_to_mode(rm, $encoding);
  F[fd] = f32_sqrt(F[fs1], mode);
  mark_f_state_dirty();
