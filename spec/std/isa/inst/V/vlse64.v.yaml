# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vlse64.v
long_name: "Vector strided load 64-bit elements"
description: |
  Loads 64-bit elements from memory starting at address in xs1 register with stride, using vector mask vm, and stores results in vector register vd. The effective element width is 64 bits.

xs-attributes:
  - microarchitecture:
    - VlduType: vlse
    - latency: 11.534180
    - throughput: 0.101668
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, RenameTableWrapper, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, VLSplitImp, VLMergeBufferImp, LoadUnit, LsqWrapper, DCache, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 0, 1, 0, 0, 0, 0, "2~N", 1, 0, 1, 1, 1, 0, 2, 0, 1, "2~N"]
  - architecture:
    - exceptions: [AccessFault, AddrMisalign, PageFault_inst, IllegalInst, AddrMisalign_inst]

operands-constraints:
  - type: vreg
    width: 5
    reg_type: VECTOR
    field: vd
  - type: reg
    width: 5
    reg_type: INTEGER
    field: rs1
    mem: true
  - type: reg
    width: 5
    reg_type: INTEGER
    field: rs2
  - type: vm
    literal: v0.t
    option: true

definedBy:
  extension:
    name: Zvl32b
assembly: vd, (xs1), xs2, vm
encoding:
  match: 000010-----------111-----0000111
  variables:
    - name: vm
      location: 25-25
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
