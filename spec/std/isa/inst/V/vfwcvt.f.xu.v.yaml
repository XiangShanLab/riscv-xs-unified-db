# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfwcvt.f.xu.v
long_name: "Vector unsigned integer to floating-point widening conversion"
description: |
  Converts unsigned integer elements from vector register vs2 to a wider floating-point format and stores results in vector register vd, using vector mask vm. The conversion follows IEEE 754 standards.
xs-attributes:
  - microarchitecture:
    - FuType: vfcvt.vfwcvt_fxuv
    - latency: 8.242188
    - throughput: 0.436860
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, VCVT, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 1, 1, 2, "0~N", 1, "2~N"]
  - architecture:
    - exceptions: [FP, IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: vreg
    width: 5
    reg_type: VECTOR
    required: '!=v0'
    field: vd
  - type: vreg
    width: 5
    reg_type: VECTOR
    field: vs2
  - type: vm
    literal: v0.t
    option: true

definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, vs2, vm
encoding:
  match: 010010------01010001-----1010111
  variables:
    - name: vm
      location: 25-25
    - name: vs2
      location: 24-20
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
