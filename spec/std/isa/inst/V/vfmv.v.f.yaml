# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vfmv.v.f
long_name: "Vector floating-point to vector move"
description: |
  Moves floating-point element from scalar register fs1 to vector register vd, using vector mask vm. This operation creates a vector with a single floating-point value.
xs-attributes:
  - microarchitecture:
    - FuType: vfalu.vfmv
    - latency: 8.030273
    - throughput: 0.761905
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, VFAlu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 1, 1, 1, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: vreg
    width: 5
    reg_type: VECTOR
    required: '!=v0'
    field: vd
  - type: freg
    width: 5
    reg_type: FLOAT
    field: rs1

definedBy:
  extension:
    anyOf:
      - name: Zvl32b
      - name: Zvfbfa
assembly: vd, fs1
encoding:
  match: 010111100000-----101-----1010111
  variables:
    - name: fs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
