# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: vmv.v.x
long_name: "Vector scalar to vector move"
description: |
  Broadcasts scalar register xs1 to all elements of vector register vd, using vector mask vm. This operation creates a vector with identical elements.
xs-attributes:
  - microarchitecture:
    - FuType: vialuF.vmv_v_v
    - latency: 11
    - throughput: 0.761905
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, VIAluFix, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 1, 1, 1, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: vreg
    width: 5
    reg_type: VECTOR
    field: vd
  - type: reg
    width: 5
    reg_type: INTEGER
    required: '!=x0'
    field: rs1

definedBy:
  extension:
    name: Zvl32b
assembly: vd, xs1
encoding:
  match: 010111100000-----100-----1010111
  variables:
    - name: xs1
      location: 19-15
    - name: vd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
