# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fcvt.s.d
long_name: Floating-Point Convert Double-Precision to Single-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `fcvt.s.d` instruction converts a double-precision floating-point number to a single-precision floating-point
  number. This is encoded in the OP-FP major opcode space and both the source and destination are floating-point
  registers. The `xs2` field encodes the datatype of the source, and the `fmt` field encodes the datatype of the
  destination. `fcvt.s.d` rounds according to the `rm` field.
xs-attributes:
  - microarchitecture:
    - FuType: fcvt.vfncvt_ffw
    - latency: 3
    - throughput: 0.785276
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, FCVT, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 1, 1, 2, 0, 1, "2~N"]
  - architecture:
    - exceptions: [NX, UF, OF, PageFault_inst, IllegalInst, AddrMisalign_inst]

operands-constraints:
  - type: freg
    reg_type: FLOAT
  - type: freg
    reg_type: FLOAT

assembly: fd, fs1, rm
encoding:
  match: 010000000001-------------1010011
  variables:
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
