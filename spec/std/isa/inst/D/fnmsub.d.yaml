# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fnmsub.d
long_name: Floating-Point Negate-Multiply-Subtract Double-Precision
definedBy:
  extension:
    oneOf:
      - name: D
      - name: Zdinx
description: |
  The `fnmsub.d` instruction multiplies the values in `fs1` and `fs2`, negates the product, adds the value in `fs3`, and
  writes the final result to `fd`.
xs-attributes:
  - microarchitecture:
    - FuType: fmac.vfnmsac
    - latency: 4
    - throughput: 1.600000
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, FMA, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 1, 1, 3, 0, 1, "2~N"]
  - architecture:
    - exceptions: [NX, UF, OF, NV, PageFault_inst, IllegalInst, AddrMisalign_inst]

operands-constraints:
  - type: freg
    reg_type: FLOAT
  - type: freg
    reg_type: FLOAT
  - type: freg
    reg_type: FLOAT
  - type: freg
    reg_type: FLOAT

assembly: fd, fs1, fs2, fs3, rm
encoding:
  match: "-----01------------------1001011"
  variables:
    - name: fs3
      location: 31-27
    - name: fs2
      location: 24-20
    - name: fs1
      location: 19-15
    - name: rm
      location: 14-12
    - name: fd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
