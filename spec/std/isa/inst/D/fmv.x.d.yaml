# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: inst_schema.json#
kind: instruction
name: fmv.x.d
definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: D
long_name: Floating-Point Move Double-Precision to Integer Register
description: |
  The `fmv.x.d` instruction moves the double-precision value in floating-point register `fs1` to a representation in
  `IEEE 754-2008` standard encoding in integer register `xd`.
xs-attributes:
  - microarchitecture:
    - FuType: fcvt
    - latency: 5.029297
    - throughput: 0.785276
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, Regfile, BypassNetwork, FCVT, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 1, 1, 2, 0, 1, "2~N"]

  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    reg_type: INTEGER
  - type: freg
    reg_type: FLOAT

assembly: xd, fs1
encoding:
  match: 111000100000-----000-----1010011
  variables:
    - name: fs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: false
operation(): |
