# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: andn
long_name: AND with inverted operand
description: |
  Performs the bitwise logical AND operation between `xs1` and the
  bitwise inversion of `xs2`.
xs-attributes:
  - microarchitecture:
    - FuType: alu.andn
    - latency: 1
    - throughput: 2.645995
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, "0~N", 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: reg
    width: 5
    reg_type: INTEGER

definedBy:
  extension:
    anyOf:
      - name: Zbb
      - name: Zbkb
assembly: xd, xs1, xs2
encoding:
  match: 0100000----------111-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  X[xd] = X[xs1] & ~X[xs2];
