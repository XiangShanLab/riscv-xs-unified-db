# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: min
long_name: Minimum
description: |
  Returns the smaller of two signed integers.
xs-attributes:
  - microarchitecture:
    - FuType: alu.min
    - latency: 1.032227
    - throughput: 2.659740
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    width: 5
  - type: reg
    width: 5
  - type: reg
    width: 5

definedBy:
  extension:
    name: Zbb
assembly: xd, xs1, xs2
encoding:
  match: 0000101----------100-----0110011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  X[xd] = ($signed(X[xs1]) < $signed(X[xs2])) ? X[xs1] : X[xs2];
