# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: mulw
long_name: Signed 32-bit multiply
description: |
  Multiplies the lower 32 bits of the source registers, placing the sign-extension of the
  lower 32 bits of the result into the destination register.

  Any overflow is thrown away.

  [NOTE]
  In RV64, MUL can be used to obtain the upper 32 bits of the 64-bit product,
  but signed arguments must be proper 32-bit signed values, whereas unsigned arguments
  must have their upper 32 bits clear. If the arguments are not known to be sign- or zero-extended,
  an alternative is to shift both arguments left by 32 bits, then use MULH[[S]U].
xs-attributes:
  - microarchitecture:
    - FuType: mul
    - latency: 3.032227
    - throughput: 1.872029
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, RenameTableWrapper, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, ExuBlock, MulUnit, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 0, 1, 0, 0, 0, 0, "2~N", 0, 1, 0, 1, 2, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    reg_type: INTEGER
  - type: reg
    reg_type: INTEGER
  - type: reg
    reg_type: INTEGER

definedBy:
  allOf:
    - xlen: 64
    - extension:
        name: Zmmul
assembly: xd, xs1, xs2
encoding:
  match: 0000001----------000-----0111011
  variables:
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  Bits<32> src1 = X[xs1][31:0];
  Bits<32> src2 = X[xs2][31:0];

  Bits<32> result = src1 * src2;
  Bits<1> sign_bit = result[31];

  # return the sign-extended result
  X[xd] = {{32{sign_bit}}, result};
