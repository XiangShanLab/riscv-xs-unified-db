# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: sh
long_name: Store halfword
description: |
  Store 16 bits of data from register `xs2` to an
  address formed by adding `xs1` to a signed offset.
xs-attributes:
  - microarchitecture:
    - FuType: stu
    - latency: 3.703125
    - throughput: 0.394605
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, RenameTableWrapper, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, StoreUnit, LsqWrapper, DCache, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 0, 1, 0, 0, 0, 0, "2~N", 0, 1, 0, 1, 0, 2, "2~N"]
  - architecture:
    - exceptions: [AccessFault_store, AddrMisalign_store, PageFault_inst, IllegalInst, PageFault_store, AddrMisalign_inst]

operands-constraints:
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: imm
    width: 12
    signed: true
    range: (-2048, 2047)

definedBy:
  extension:
    name: I
assembly: xs2, imm(xs1)
encoding:
  match: "-----------------001-----0100011"
  variables:
    - name: imm
      location: 31-25|11-7
      sign_extend: true
    - name: xs2
      location: 24-20
    - name: xs1
      location: 19-15
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg virtual_address = X[xs1] + $signed(imm);

  write_memory(16, virtual_address, X[xs2][15:0], $encoding);
