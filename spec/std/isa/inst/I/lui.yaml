# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: lui
long_name: Load upper immediate
description: Load the zero-extended imm into xd.
xs-attributes:
  - microarchitecture:
    - FuType: alu.add
    - throughput: 2.206897
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, 0, 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: imm
    width: 20
    signed: false

definedBy:
  extension:
    name: I
assembly: xd, imm
encoding:
  match: "-------------------------0110111"
  variables:
    - name: imm
      location: 31-12
      left_shift: 12
      sign_extend: true
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): X[xd] = $signed(imm);
