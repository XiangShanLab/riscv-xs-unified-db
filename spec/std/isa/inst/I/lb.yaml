# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: lb
long_name: Load byte
description: |
  Load 8 bits of data into register `xd` from an
  address formed by adding `xs1` to a signed offset.
  Sign extend the result.
xs-attributes:
  - microarchitecture:
    - FuType: ldu
    - latency: 3.703125
    - throughput: 0.915103
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, LoadUnit, DCache, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 1, 2, 0, 1, "2~N"]
  - architecture:
    - exceptions: [PageFault_load, AccessFault_load, PageFault_inst, IllegalInst, AddrMisalign_inst]

operands-constraints:
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: imm
    width: 12
    signed: true
    range: (-2048, 2047)

definedBy:
  extension:
    name: I
assembly: xd, imm(xs1)
encoding:
  match: "-----------------000-----0000011"
  variables:
    - name: imm
      location: 31-20
      sign_extend: true
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
operation(): |
  XReg virtual_address = X[xs1] + $signed(imm);

  X[xd] = sext(read_memory(8, virtual_address, $encoding), 8);
