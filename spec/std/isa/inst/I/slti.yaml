# yaml-language-server: $schema=../../../../schemas/inst_schema.json

$schema: "inst_schema.json#"
kind: instruction
name: slti
long_name: Set on less than immediate
description: |
  Places the value 1 in register `xd` if register `xs1` is less than the sign-extended immediate
  when both are treated as signed numbers, else 0 is written to `xd`.
xs-attributes:
  - microarchitecture:
    - FuType: alu.slt
    - latency: 1
    - throughput: 2.645995
    - lifecycle_normal: [Bpu, Ftq, ICache, NewIFU, IBuffer, DecodeStage, Rename, MEFreeList, NewDispatch, BusyTable, Scheduler, IssueQueue, RegCache, Regfile, BypassNetwork, Alu, WbDataPath, Regfile, Rob]
    - lifecycle_normal_latency: [1, 1, "2~N", 1, "0~N", 1, 1, 0, 0, 0, 0, "2~N", 0, 1, 1, 0, "0~N", 1, "2~N"]
  - architecture:
    - exceptions: [IllegalInst, AddrMisalign_inst, PageFault_inst]

operands-constraints:
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: reg
    width: 5
    reg_type: INTEGER
  - type: imm
    width: 12
    signed: true
    range: (-2048, 2047)

definedBy:
  extension:
    name: I
assembly: xd, xs1, imm
encoding:
  match: "-----------------010-----0010011"
  variables:
    - name: imm
      location: 31-20
      sign_extend: true
    - name: xs1
      location: 19-15
    - name: xd
      location: 11-7
access:
  s: always
  u: always
  vs: always
  vu: always
data_independent_timing: true
operation(): |
  X[xd] = ($signed(X[xs1]) < $signed(imm)) ? '1 : '0;
